<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>اعرف لجنتك</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Cairo', Tahoma, sans-serif;
      margin: 0;
      padding: 0;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      color: #000000;
    }
    header {
  background-color: #ce1126;
  color: white;
  text-align: center;
  padding: 0.6em 1em; /* قللت ال padding إلى النصف رأسياً */
  font-size: 1.8em; /* حجم الخط كما هو */
  font-weight: bold;
  letter-spacing: 1px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.2);
}


    main {
      flex-grow: 1;
      padding: 1em;
      max-width: 700px;
      margin: 0 auto;
      width: 100%;
    }
    main img {
      display: block;
      max-width: 100%;
      height: auto;
      margin: 1em auto 1.5em;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    form {
      display: flex;
      gap: 0.8em;
      margin-bottom: 0.3em;
      flex-wrap: wrap;
      justify-content: center;
    }
    input[type="text"], input[type="tel"] {
      font-size: 1.1em;
      padding: 0.6em 0.8em;
      border: 2px solid #ce1126;
      border-radius: 6px;
      outline-offset: 2px;
      color: #000;
      flex-grow: 1;
    }
    input[type="text"] {
      direction: rtl;
    }
    input[type="tel"] {
      direction: ltr;
      max-width: 200px;
    }
    button {
      background-color: #ce1126;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 0 1.6em;
      font-size: 1.1em;
      cursor: pointer;
      transition: background-color 0.3s ease;
      min-width: 100px;
    }
    button:disabled {
      background-color: #a3a3a3;
      cursor: not-allowed;
    }
    .phone-form button {
      background-color: #28a745;
    }
    .note {
      color: #000;
      font-size: 0.95em;
      margin-bottom: 0.8em;
      text-align: center;
    }
    #resultsContainer {
      margin-top: 1em;
      display: flex;
      flex-direction: column;
      gap: 1em;
    }
    .result-item {
      background: #000000;
      border-radius: 10px;
      box-shadow: 0 6px 15px rgba(0,0,0,0.08);
      padding: 1.2em 1em;
      text-align: center;
      color: white;
      position: relative;
    }
    .result-item h3 {
      font-size: 1.4em;
      margin-bottom: 0.3em;
      color: #ce1126;
    }
    .phone-form {
      margin-top: 1em;
      display: flex;
      gap: 0.6em;
      justify-content: center;
      flex-wrap: wrap;
    }
    footer {
      background-color: #000000;
      padding: 1em;
      color: white;
      text-align: center;
      font-size: 1em;
      margin-top: auto;
      letter-spacing: 0.5px;
    }
    @media (max-width: 480px) {
      form, .phone-form {
        flex-direction: column;
      }
      input[type="text"], input[type="tel"] {
        max-width: 100%;
      }
      button {
        min-width: 100%;
      }
    }
  </style>
</head>
<body>

<header>اعرف لجنتك</header>

<main>
  <img src="maghrabi.jpeg" alt="صورة انتخابية" />
  
  <form id="searchForm" role="search" onsubmit="return false;">
    <input type="text" id="voterName" placeholder="اكتب اسمك كما في بطاقة الرقم القومي" aria-label="اسم الناخب" autocomplete="off" />
    <button id="searchBtn" disabled>بحث</button>
  </form>
  
  <p class="note">الرجاء كتابة الاسم مطابق لبطاقة الرقم القومي مع مراعاة الهمزات وعدم وضع مسافة في الاسماء المركبة</p>

  <div id="resultsContainer"></div>
</main>

<footer>
  مع تحيات حملة المرشح المحاسب محمد حسن المغربي - مرشح مجلس النواب 2025 رقم 13<br />
  </footer>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

  const supabase = createClient(
    'https://mqxzwneumukykzphrlnu.supabase.co', 
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1xeHp3bmV1bXVreWt6cGhybG51Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjI4ODEwMjEsImV4cCI6MjA3ODQ1NzAyMX0.DGvv9NTPDpDpD3hfGrxLrnwGwxqwqppCw9agPHJXXmQ'
  );

  const voterNameInput = document.getElementById('voterName');
  const searchBtn = document.getElementById('searchBtn');
  const resultsContainer = document.getElementById('resultsContainer');

  voterNameInput.addEventListener('input', () => {
    searchBtn.disabled = voterNameInput.value.trim() === '';
    resultsContainer.innerHTML = '';
  });

  function normalizeName(name) {
    return name
      .toLowerCase()
      .replace(/[\u064B-\u065F]/g, '')
      .replace(/[أإآا]/g, 'ا')
      .replace(/ة/g, 'ه')
      .replace(/ى/g, 'ي')
      .replace(/ئ/g, 'ي')
      .replace(/ؤ/g, 'و')
      .replace(/\s+/g, ' ')
      .trim();
  }

  async function searchVoterByName(name) {
    const normalizedInput = normalizeName(name);
    const { data, error } = await supabase
      .from('main')
      .select('Name, Serial, Lagna, School, Address')
      .ilike('Name', `%${name}%`)
      .limit(20);

    if (error) {
      alert('حدث خطأ أثناء البحث. حاول مرة أخرى.');
      return [];
    }

    const filteredResults = data.filter(item => {
      const normalizedItemName = normalizeName(item.Name);
      return normalizedItemName.includes(normalizedInput);
    });

    if (filteredResults.length === 0) {
      alert('لم يتم العثور على نتائج مطابقة.');
    }

    return filteredResults;
  }

  // إضافة حقل المسلسل في البطاقة الظاهرة بعد البحث
  function createResultItem(item) {
    return `
      <div class="result-item" tabindex="0" data-serial="${item.Serial}">
        <h3>${item.Name}</h3>
        <p>رقم المسلسل: ${item.Serial}</p>
        <p>رقم اللجنة: ${item.Lagna}</p>
        <p>اسم المدرسة: ${item.School}</p>
        <p>عنوان المدرسة: ${item.Address}</p>
        <form class="phone-form" onsubmit="return false;">
          <input type="tel" placeholder="أدخل رقم هاتفك" aria-label="رقم الهاتف" required />
          <button type="submit">موافق</button>
        </form>
      </div>
    `;
  }

  resultsContainer.addEventListener('click', async (e) => {
    if (e.target.tagName === 'BUTTON' && e.target.closest('.phone-form')) {
      const form = e.target.closest('.phone-form');
      const phoneInput = form.querySelector('input[type="tel"]');
      const phone = phoneInput.value.trim();
      if (!phone) {
        alert('يرجى إدخال رقم الهاتف.');
        return;
      }
      const resultItem = e.target.closest('.result-item');
      const voterData = {
        name: resultItem.querySelector('h3').textContent,
        serial: resultItem.querySelector('p:nth-of-type(1)').textContent.replace('رقم المسلسل: ', ''),
        committee: resultItem.querySelector('p:nth-of-type(2)').textContent.replace('رقم اللجنة: ', ''),
        school: resultItem.querySelector('p:nth-of-type(3)').textContent.replace('اسم المدرسة: ', ''),
        Address: resultItem.querySelector('p:nth-of-type(4)').textContent.replace('عنوان المدرسة: ', ''),
        phone: phone
      };

      try {
        const response = await fetch('https://n8n.101488.xyz/webhook/maghraby', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(voterData)
        });
        if (!response.ok) {
          const errorText = await response.text();
          alert('فشل الإرسال: ' + errorText);
          return;
        }
        alert('تم إرسال البيانات بنجاح.');
        phoneInput.value = '';
      } catch (error) {
        alert('حدث خطأ أثناء الإرسال: ' + error.message);
        console.error(error);
      }
    }
  });

  document.getElementById('searchForm').addEventListener('submit', async () => {
    const name = voterNameInput.value.trim();
    if (!name) return;
    const results = await searchVoterByName(name);
    if (results.length === 0) {
      resultsContainer.innerHTML = '<p>لم يتم العثور على نتائج.</p>';
    } else {
      resultsContainer.innerHTML = results.map(createResultItem).join('');
    }
  });
</script>

</body>
</html>
